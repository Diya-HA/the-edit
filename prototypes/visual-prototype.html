/* ═══════════════════════════════════════════════════════════════
   Tiny dependency-free renderer (createElement-style, real DOM nodes)
   ═══════════════════════════════════════════════════════════════ */
const SVG_NS = 'http://www.w3.org/2000/svg';
const UNITLESS = new Set(['opacity','zIndex','fontWeight','lineHeight','flex','flexGrow','flexShrink','order','columnCount','zoom']);

function applyStyle(node, style) {
  for (const k in style) {
    let v = style[k];
    if (typeof v === 'number' && !UNITLESS.has(k)) v = v + 'px';
    node.style[k] = v;
  }
}
function applyProps(node, props, isSvg) {
  if (!props) return;
  for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'style') applyStyle(node, v);
    else if (k === 'className') node.setAttribute('class', v);
    else if (k === 'value') node.value = v;
    else if (k.charCodeAt(0) === 111 && k.charCodeAt(1) === 110 && k[2] >= 'A' && k[2] <= 'Z') {
      // onClick / onInput / onChange ...
      const ev = (k === 'onChange' || k === 'onInput') ? 'input' : k.slice(2).toLowerCase();
      node.addEventListener(ev, v);
    } else {
      node.setAttribute(k, v);
    }
  }
}
function appendKids(node, kids) {
  for (let c of kids.flat(Infinity)) {
    if (c == null || c === false || c === true) continue;
    node.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
  }
}
// html element
function el(tag, props, ...kids) {
  const node = document.createElement(tag);
  applyProps(node, props, false);
  appendKids(node, kids);
  return node;
}
// svg element (tag + all descendants must go through sv)
function sv(tag, props, ...kids) {
  const node = document.createElementNS(SVG_NS, tag);
  applyProps(node, props, true);
  appendKids(node, kids);
  return node;
}

/* ═══════════════════════════════════════════════════════════════
   ShopApp — ported from ShopApp.dc.html
   Data / tokens / handlers / view builders preserved verbatim.
   ═══════════════════════════════════════════════════════════════ */
class ShopApp {
  constructor(theme) {
    this.theme = theme === 'masc' ? 'masc' : 'fem';
    const boards = this.initialBoards(this.theme);
    const following = this.theme === 'masc'
      ? { 'Carhartt WIP': true, 'Our Legacy': true }
      : { 'Reformation': true, 'Sézane': true };
    this.state = {
      tab: 'feed', detailId: null, colorFilter: null, catFilter: 'all',
      query: '', saveFor: null, openBoardId: null, toast: '',
      boards, following,
    };
    this._toastTimer = null;
    this.container = el('div', { style: { flex: '0 0 auto' } });
    this.onQuery = this.onQuery.bind(this);
  }

  // ---------- lifecycle / state ----------
  mount(parent) { parent.appendChild(this.container); this.rerender(); return this; }
  setState(patch) {
    const next = typeof patch === 'function' ? patch(this.state) : patch;
    this.state = Object.assign({}, this.state, next);
    this.rerender();
  }
  rerender() {
    const active = document.activeElement;
    let caret = null, wasSearch = false;
    if (active && this.container.contains(active) && active.tagName === 'INPUT') { wasSearch = true; caret = active.selectionStart; }
    this.container.replaceChildren(this.view());
    if (wasSearch) {
      const inp = this.container.querySelector('input');
      if (inp) { inp.focus(); try { inp.setSelectionRange(caret, caret); } catch (e) {} }
    }
  }

  // ---------- DATA ----------
  tokens() {
    if (this.theme === 'masc') {
      return {
        bg: '#E7E4DC', surface: '#F2F0EA', ink: '#1E1F1B', muted: '#85857A',
        line: 'rgba(30,31,27,0.12)', accent: '#3F5560', accentInk: '#FFFFFF',
        chip: '#DAD7CE', chipActiveBg: '#1E1F1B', chipActiveInk: '#F2F0EA',
        display: "'Bricolage Grotesque', system-ui, sans-serif",
        ui: "'Hanken Grotesk', system-ui, sans-serif",
        price: "'Space Mono', ui-monospace, monospace",
        mono: "'Space Mono', ui-monospace, monospace",
        wordWeight: 800, wordSize: 26, wordSpacing: '-0.5px', wordTransform: 'uppercase',
        appName: 'STACK', aesthetic: 'Quiet Utility ’26', avatar: 'JD', frameDark: false,
      };
    }
    return {
      bg: '#F3EAE0', surface: '#FBF6EF', ink: '#322A24', muted: '#A0917F',
      line: 'rgba(50,42,36,0.10)', accent: '#BE6F58', accentInk: '#FFFFFF',
      chip: '#EBDDCD', chipActiveBg: '#322A24', chipActiveInk: '#FBF6EF',
      display: "'Instrument Serif', Georgia, serif",
      ui: "'Hanken Grotesk', system-ui, sans-serif",
      price: "'Hanken Grotesk', system-ui, sans-serif",
      mono: "'Space Mono', ui-monospace, monospace",
      wordWeight: 400, wordSize: 34, wordSpacing: '0.5px', wordTransform: 'none',
      appName: 'Muse', aesthetic: 'Soft Romance ’26', avatar: 'AL', frameDark: false,
    };
  }
  colorMap() {
    if (this.theme === 'masc') return {
      stone: { hex: '#C9C5BC', on: '#6B675E', name: 'Stone' },
      slate: { hex: '#6E7A82', on: '#EAF0F2', name: 'Slate' },
      olive: { hex: '#7C7A58', on: '#EFEEDD', name: 'Olive' },
      rust: { hex: '#A65A3C', on: '#F6E7DF', name: 'Rust' },
      sand: { hex: '#C7B295', on: '#665736', name: 'Sand' },
      ink: { hex: '#2A2A28', on: '#C9C5BC', name: 'Ink' },
    };
    return {
      cream: { hex: '#EFE3D2', on: '#7A6E5E', name: 'Cream' },
      rose: { hex: '#E2B7B0', on: '#7E4F49', name: 'Rose' },
      clay: { hex: '#C98A6A', on: '#5C3A28', name: 'Clay' },
      butter: { hex: '#E8CD79', on: '#7A6326', name: 'Butter' },
      sage: { hex: '#AEB59A', on: '#474D3A', name: 'Sage' },
      ink: { hex: '#3A332C', on: '#D9CFC2', name: 'Ink' },
    };
  }
  products() {
    if (this.theme === 'masc') return [
      { id: 'm1', brand: 'Carhartt WIP', title: 'Detroit jacket', cat: 'outerwear', price: 228, was: 268, color: 'rust', h: 270 },
      { id: 'm2', brand: 'Stüssy', title: 'Heavyweight tee', cat: 'tops', price: 65, color: 'stone', h: 196 },
      { id: 'm3', brand: 'Our Legacy', title: 'Pleated trouser', cat: 'trousers', price: 260, color: 'slate', h: 300 },
      { id: 'm4', brand: 'A.P.C.', title: 'Petit New Standard', cat: 'denim', price: 215, color: 'ink', h: 256 },
      { id: 'm5', brand: 'Norse Projects', title: 'Merino crew knit', cat: 'knitwear', price: 145, color: 'olive', h: 224 },
      { id: 'm6', brand: 'Aimé Leon Dore', title: 'Logo hoodie', cat: 'tops', price: 190, was: 220, color: 'sand', h: 240 },
      { id: 'm7', brand: 'Carhartt WIP', title: 'Regular cargo pant', cat: 'trousers', price: 128, color: 'olive', h: 276 },
      { id: 'm8', brand: 'Stüssy', title: 'Stock bucket hat', cat: 'accessories', price: 55, color: 'stone', h: 168 },
      { id: 'm9', brand: 'Our Legacy', title: 'Box short shirt', cat: 'tops', price: 230, color: 'slate', h: 236 },
      { id: 'm10', brand: 'Norse Projects', title: 'Gore-Tex shell', cat: 'outerwear', price: 499, was: 560, color: 'ink', h: 312 },
      { id: 'm11', brand: 'A.P.C.', title: 'Suede court sneaker', cat: 'shoes', price: 310, color: 'sand', h: 200 },
      { id: 'm12', brand: 'Aimé Leon Dore', title: 'Wool ball cap', cat: 'accessories', price: 98, color: 'rust', h: 176 },
      { id: 'm13', brand: 'Carhartt WIP', title: 'Pocket tee — 2 pack', cat: 'tops', price: 45, color: 'stone', h: 200 },
      { id: 'm14', brand: 'Norse Projects', title: 'Pleated walk short', cat: 'shorts', price: 110, color: 'olive', h: 216 },
    ];
    return [
      { id: 'f1', brand: 'Reformation', title: 'Linen slip dress', cat: 'dresses', price: 148, was: 198, color: 'cream', h: 286 },
      { id: 'f2', brand: 'Djerf Avenue', title: 'Cloud knit cardigan', cat: 'knitwear', price: 120, color: 'butter', h: 224 },
      { id: 'f3', brand: 'With Jéan', title: 'Lace baby tee', cat: 'tops', price: 59, color: 'rose', h: 200 },
      { id: 'f4', brand: 'Ganni', title: 'Buckle ballet flat', cat: 'shoes', price: 245, color: 'ink', h: 182 },
      { id: 'f5', brand: 'Sézane', title: 'Bias silk midi skirt', cat: 'skirts', price: 135, color: 'clay', h: 300 },
      { id: 'f6', brand: 'Aritzia', title: 'Effortless trouser', cat: 'trousers', price: 128, color: 'sage', h: 248 },
      { id: 'f7', brand: 'Reformation', title: 'Ruffle wrap blouse', cat: 'tops', price: 98, was: 128, color: 'rose', h: 262 },
      { id: 'f8', brand: 'Aritzia', title: 'Cropped rib cardigan', cat: 'knitwear', price: 78, color: 'cream', h: 200 },
      { id: 'f9', brand: 'Ganni', title: 'Floral wrap dress', cat: 'dresses', price: 295, color: 'butter', h: 322 },
      { id: 'f10', brand: 'Sézane', title: 'Suede mary janes', cat: 'shoes', price: 185, color: 'clay', h: 220 },
      { id: 'f11', brand: 'Djerf Avenue', title: 'Oversized blazer', cat: 'outerwear', price: 210, was: 260, color: 'sage', h: 280 },
      { id: 'f12', brand: 'With Jéan', title: 'Satin slip skirt', cat: 'skirts', price: 72, color: 'rose', h: 240 },
      { id: 'f13', brand: 'Aritzia', title: 'Contour rib tank', cat: 'tops', price: 35, color: 'cream', h: 184 },
      { id: 'f14', brand: 'Ganni', title: 'Soft wool beanie', cat: 'accessories', price: 85, color: 'ink', h: 164 },
    ];
  }
  initialBoards(theme) {
    if (theme === 'masc') return [
      { id: 'b1', name: 'Workwear', items: ['m1', 'm7', 'm13'] },
      { id: 'b2', name: 'Off duty', items: ['m2', 'm4', 'm6'] },
    ];
    return [
      { id: 'b1', name: 'Soft summer', items: ['f1', 'f3', 'f9'] },
      { id: 'b2', name: 'Office hours', items: ['f6', 'f11'] },
    ];
  }
  descFor(p) {
    const a = this.tokens().aesthetic;
    return `A ${p.cat.replace(/s$/, '')} piece from the ${a} edit — chosen to layer into one cohesive wardrobe.`;
  }

  // ---------- DERIVED ----------
  find(id) { return this.products().find(p => p.id === id); }
  isSaved(id) { return this.state.boards.some(b => b.items.includes(id)); }
  cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  // ---------- HANDLERS ----------
  setTab(tab) { this.setState({ tab, openBoardId: null }); }
  openDetail(id) { this.setState({ detailId: id }); }
  closeDetail() { this.setState({ detailId: null }); }
  openSave(id) { this.setState({ saveFor: id }); }
  closeSave() { this.setState({ saveFor: null }); }
  setColor(key) { this.setState(s => ({ colorFilter: s.colorFilter === key ? null : key })); }
  setCat(key) { this.setState({ catFilter: key }); }
  onQuery(e) { const v = e.target.value; this.setState({ query: v }); }
  openBoard(id) { this.setState({ openBoardId: id }); }
  closeBoard() { this.setState({ openBoardId: null }); }
  showToast(msg) {
    this.setState({ toast: msg });
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => this.setState({ toast: '' }), 1900);
  }
  toggleBoard(boardId, pid) {
    let added = false, name = '';
    const boards = this.state.boards.map(b => {
      if (b.id !== boardId) return b;
      name = b.name;
      const has = b.items.includes(pid);
      added = !has;
      return Object.assign({}, b, { items: has ? b.items.filter(x => x !== pid) : b.items.concat([pid]) });
    });
    this.setState({ boards, saveFor: null });
    this.showToast(added ? `Saved to ${name}` : `Removed from ${name}`);
  }
  newBoard(pid) {
    const p = this.find(pid);
    const name = this.cap(p.cat);
    const id = 'b' + Date.now();
    this.setState(s => ({ boards: s.boards.concat([{ id, name, items: [pid] }]), saveFor: null }));
    this.showToast(`New board · ${name}`);
  }
  toggleFollow(brand) {
    const now = !this.state.following[brand];
    this.setState(s => {
      const following = Object.assign({}, s.following);
      if (following[brand]) delete following[brand]; else following[brand] = true;
      return { following };
    });
    this.showToast(now ? `Following ${brand}` : `Unfollowed ${brand}`);
  }

  // ---------- VIEW BUILDERS ----------
  card(p, t, cm, opts) {
    const o = opts || {};
    const c = cm[p.color];
    const saved = this.isSaved(p.id);
    const h = o.h || p.h;
    return {
      id: p.id, brand: p.brand, title: p.title, caption: p.cat,
      priceLabel: '$' + p.price,
      hasDrop: !!p.was, oldPriceLabel: p.was ? '$' + p.was : '',
      dropLabel: p.was ? '↓ ' + Math.round((1 - p.price / p.was) * 100) + '%' : '',
      saved, saveGlyph: saved ? '♥' : '♡',
      onOpen: () => this.openDetail(p.id),
      onSave: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.openSave(p.id); },
      cardStyle: { breakInside: 'avoid', WebkitColumnBreakInside: 'avoid', marginBottom: 14, display: 'inline-block', width: '100%' },
      thumbStyle: { width: '100%', height: h, borderRadius: 16, background: c.hex, position: 'relative', overflow: 'hidden', cursor: 'pointer' },
      sheenStyle: { position: 'absolute', inset: 0, background: 'linear-gradient(140deg, rgba(255,255,255,0.22), rgba(255,255,255,0) 42%, rgba(0,0,0,0.07))', pointerEvents: 'none' },
      captionStyle: { position: 'absolute', left: 12, right: 12, top: '50%', transform: 'translateY(-50%)', textAlign: 'center', fontFamily: t.mono, fontSize: 10.5, letterSpacing: 2.5, textTransform: 'uppercase', color: c.on, opacity: 0.52, pointerEvents: 'none' },
      saveBtnStyle: { position: 'absolute', top: 9, right: 9, width: 31, height: 31, borderRadius: 16, background: 'rgba(255,255,255,0.86)', backdropFilter: 'blur(6px)', WebkitBackdropFilter: 'blur(6px)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 15, lineHeight: 1, color: saved ? t.accent : '#4a4a4a', cursor: 'pointer', boxShadow: '0 1px 4px rgba(0,0,0,0.18)' },
    };
  }

  renderVals() {
    const t = this.tokens();
    const cm = this.colorMap();
    const s = this.state;
    const products = this.products();

    const q = s.query.trim().toLowerCase();
    const gridItems = products.filter(p =>
      (s.colorFilter ? p.color === s.colorFilter : true) &&
      (s.catFilter === 'all' ? true : p.cat === s.catFilter) &&
      (q ? (p.title + ' ' + p.brand + ' ' + p.cat).toLowerCase().includes(q) : true)
    ).map(p => this.card(p, t, cm));

    const colorDots = Object.keys(cm).map(key => {
      const active = s.colorFilter === key;
      return {
        key,
        onClick: () => this.setColor(key),
        wrapStyle: { flex: '0 0 auto', padding: 3, borderRadius: 999, border: active ? '2px solid ' + t.ink : '2px solid transparent', cursor: 'pointer', transition: 'border-color .15s' },
        dotStyle: { width: 26, height: 26, borderRadius: 999, background: cm[key].hex, boxShadow: 'inset 0 0 0 1px rgba(0,0,0,0.08)' },
      };
    });

    const cats = ['all'].concat(Array.from(new Set(products.map(p => p.cat))));
    const chips = cats.map(key => {
      const active = s.catFilter === key;
      return {
        key, label: key === 'all' ? 'All' : this.cap(key),
        onClick: () => this.setCat(key),
        style: {
          flex: '0 0 auto', padding: '7px 14px', borderRadius: 999, cursor: 'pointer',
          fontFamily: t.ui, fontSize: 12.5, fontWeight: 600, whiteSpace: 'nowrap',
          background: active ? t.chipActiveBg : t.chip,
          color: active ? t.chipActiveInk : t.ink,
        },
      };
    });

    const boardsView = s.boards.map(b => {
      const tiles = b.items.slice(0, 3).map((pid, i) => {
        const p = this.find(pid);
        return { style: { flex: 1, background: p ? cm[p.color].hex : t.chip, borderRight: i < 2 ? '2px solid ' + t.surface : 'none' } };
      });
      while (tiles.length < 3) tiles.push({ style: { flex: 1, background: t.chip, borderRight: tiles.length < 2 ? '2px solid ' + t.surface : 'none' } });
      return {
        id: b.id, name: b.name, countLabel: b.items.length + (b.items.length === 1 ? ' piece' : ' pieces'),
        onOpen: () => this.openBoard(b.id),
        coverStyle: { display: 'flex', height: 116, borderRadius: 14, overflow: 'hidden', marginBottom: 8 },
        tiles,
      };
    });

    const openBoardObj = s.boards.find(b => b.id === s.openBoardId);
    const boardGridItems = openBoardObj ? openBoardObj.items.map(id => this.find(id)).filter(Boolean).map(p => this.card(p, t, cm)) : [];

    const brandNames = Array.from(new Set(products.map(p => p.brand)));
    const brandsView = brandNames.map(name => {
      const items = products.filter(p => p.brand === name);
      const drops = items.filter(p => p.was).length;
      const following = !!s.following[name];
      const c = cm[items[0].color];
      return {
        name,

      sheetHandleStyle: { width: 40, height: 4, borderRadius: 999, background: t.line, margin: '0 auto 14px' },

  }

  // ---------- DOM VIEW ----------
  cardNode(v, it, opts) {
    const o = opts || {};
    return el('div', { style: it.cardStyle },
      el('div', { style: it.thumbStyle, onClick: it.onOpen },
        el('div', { style: it.sheenStyle }),
        el('div', { style: it.captionStyle }, it.caption),
        (o.withDrop && it.hasDrop) ? el('div', { style: v.dropBadgeStyle }, it.dropLabel) : null,
        o.withSave ? el('div', { style: it.saveBtnStyle, onClick: it.onSave }, it.saveGlyph) : null
      ),
      el('div', { style: v.metaStyle },
        el('div', { style: v.brandStyle }, it.brand),
        el('div', { style: v.titleStyle }, it.title),
        el('div', { style: v.priceRowStyle },
          el('span', { style: v.priceStyle }, it.priceLabel),
          (o.withDrop && it.hasDrop) ? el('span', { style: v.oldPriceStyle }, it.oldPriceLabel) : null
        )
      )
    );
  }

  navTab(style, icon, label) {
    return el('div', { style: style },
      icon,
      el('div', { style: this._v.navLabelStyle }, label)
    );
  }

  view() {
    const v = this.renderVals();
    this._v = v;

    // HEADER
    const header = el('div', { style: v.headerStyle },
      el('div', { style: v.wordmarkRowStyle },
        el('div', null,
          el('div', { style: v.wordmarkStyle }, v.appName),
          el('div', { style: v.aestheticStyle }, v.aesthetic)
        ),
        el('div', { style: v.avatarStyle }, v.avatarInitials)
      ),
      v.showFilters ? el('div', { style: v.subHeaderStyle },
        el('div', { style: v.filterLabelStyle }, 'FILTER BY PALETTE'),
        el('div', { className: 'sc-scroll', style: v.colorRowStyle },
          v.colorDots.map(dot => el('div', { style: dot.wrapStyle, onClick: dot.onClick }, el('div', { style: dot.dotStyle })))
        ),
        el('div', { className: 'sc-scroll', style: v.chipRowStyle },
          v.chips.map(chip => el('div', { style: chip.style, onClick: chip.onClick }, chip.label))
        )
      ) : null
    );

    // CONTENT
    const contentKids = [];
    if (v.isSearch) {
      contentKids.push(el('div', { style: v.searchWrapStyle },
        el('input', { style: v.searchInputStyle, value: v.query, placeholder: 'Search the edit — brand, piece, vibe', onInput: this.onQuery })
      ));
    }
    if (v.showGrid) {
      contentKids.push(el('div', { style: v.resultsMetaStyle }, v.resultsLabel));
      contentKids.push(el('div', { style: v.masonryStyle }, v.gridItems.map(it => this.cardNode(v, it, { withSave: true, withDrop: true }))));
      if (v.gridEmpty) contentKids.push(el('div', { style: v.emptyStyle }, 'Nothing in this palette yet — try another color.'));
    }
    if (v.isBoards) {
      if (v.boardOpen) {
        contentKids.push(el('div', { style: v.boardBackRowStyle },
          el('div', { style: v.backBtnStyle, onClick: v.onCloseBoard }, '‹ Boards'),
          el('div', { style: v.boardOpenTitleStyle }, v.currentBoardName)
        ));
        contentKids.push(el('div', { style: v.masonryStyle }, v.boardGridItems.map(it => this.cardNode(v, it, {}))));
      } else {
        contentKids.push(el('div', { style: v.sectionTitleStyle }, 'Your boards'));
        contentKids.push(el('div', { style: v.boardsGridStyle },
          v.boardsView.map(b => el('div', { style: v.boardCardStyle, onClick: b.onOpen },
            el('div', { style: b.coverStyle }, b.tiles.map(tile => el('div', { style: tile.style }))),
            el('div', { style: v.boardNameStyle }, b.name),
            el('div', { style: v.boardCountStyle }, b.countLabel)
          ))
        ));
      }
    }
    if (v.isBrands) {
      contentKids.push(el('div', { style: v.sectionTitleStyle }, 'Price drops'));
      contentKids.push(el('div', { style: v.dropSubStyle }, 'On pieces from your shelf'));
      contentKids.push(el('div', { className: 'sc-scroll', style: v.dropsRowStyle },
        v.dropsView.map(d => el('div', { style: v.dropCardStyle, onClick: d.onOpen },
          el('div', { style: d.thumbStyle }, el('div', { style: d.pctStyle }, d.pctLabel)),
          el('div', { style: v.dropBrandStyle }, d.brand),
          el('div', { style: v.dropTitleStyle }, d.title),
          el('div', { style: v.priceRowStyle },
            el('span', { style: v.dropNowStyle }, d.nowLabel),
            el('span', { style: v.oldPriceStyle }, d.wasLabel)
          )
        ))
      ));
      contentKids.push(el('div', { style: v.sectionTitleStyle }, 'The shelf'));
      contentKids.push(el('div', { style: v.brandsListStyle },
        v.brandsView.map(br => el('div', { style: v.brandRowStyle },
          el('div', { style: br.swatchStyle }),
          el('div', { style: v.brandTextWrapStyle },
            el('div', { style: v.brandNameStyle }, br.name),
            el('div', { style: v.brandMetaStyle }, br.metaLabel)

          el('div', { style: br.followStyle, onClick: br.onFollow }, br.followLabel)

    const content = el('div', { className: 'sc-scroll', style: v.contentStyle }, contentKids);

      this.navTab(v.navFeedStyle,
        sv('svg', { width: 22, height: 22, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': 1.9 },
          sv('rect', { x: 3, y: 3, width: 7, height: 7, rx: 1.4 }), sv('rect', { x: 14, y: 3, width: 7, height: 7, rx: 1.4 }),
          sv('rect', { x: 3, y: 14, width: 7, height: 7, rx: 1.4 }), sv('rect', { x: 14, y: 14, width: 7, height: 7, rx: 1.4 })

      this.navTab(v.navSearchStyle,
        sv('svg', { width: 22, height: 22, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': 1.9 },
          sv('circle', { cx: 11, cy: 11, r: 7 }), sv('path', { d: 'M20 20l-3.5-3.5', 'stroke-linecap': 'round' })
        ), 'Search'),
      this.navTab(v.navBoardsStyle,
        sv('svg', { width: 22, height: 22, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': 1.9 },
          sv('path', { d: 'M6 3.5h12a1 1 0 0 1 1 1V21l-7-4.6L5 21V4.5a1 1 0 0 1 1-1z', 'stroke-linejoin': 'round' })
        ), 'Boards'),
      this.navTab(v.navBrandsStyle,
        sv('svg', { width: 22, height: 22, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': 1.9 },
          sv('path', { d: 'M3 4.5h6l11 11-5 5-11-11v-5z', 'stroke-linejoin': 'round' }), sv('circle', { cx: 7, cy: 8.5, r: 1.4, fill: 'currentColor', stroke: 'none' })
        ), 'Shelf')
    );
    // rebind onClick on nav tabs (navTab lost handlers) — attach here
    nav.children[0].addEventListener('click', v.onTabFeed);
    nav.children[1].addEventListener('click', v.onTabSearch);
    nav.children[2].addEventListener('click', v.onTabBoards);
    nav.children[3].addEventListener('click', v.onTabBrands);

    // APP shell
    const appKids = [header, content, nav];

    // DETAIL
    if (v.hasDetail) {
      appKids.push(el('div', { className: 'sc-scroll', style: v.detailStyle },
        el('div', { style: v.detailBarStyle },
          el('div', { style: v.detailCloseStyle, onClick: v.onCloseDetail }, '✕'),
          el('div', { style: v.detail.heartStyle, onClick: v.detail.onSave }, v.detail.heartGlyph)

        el('div', { style: v.detail.heroStyle },
          el('div', { style: v.detail.heroSheenStyle }),
          el('div', { style: v.detail.heroCaptionStyle }, v.detail.caption)
        ),
        el('div', { style: v.detailBodyStyle },
          el('div', { style: v.brandStyle }, v.detail.brand),
          el('div', { style: v.detailTitleStyle }, v.detail.title),
          el('div', { style: v.detailPriceRowStyle },
            el('span', { style: v.detailPriceStyle }, v.detail.priceLabel),
            v.detail.hasDrop ? el('span', { style: v.oldPriceStyle }, v.detail.oldPriceLabel) : null,
            v.detail.hasDrop ? el('span', { style: v.detailDropTagStyle }, v.detail.dropLabel) : null
          ),
          el('div', { style: v.detailColorRowStyle },
            el('div', { style: v.detail.swatchStyle }),
            el('span', { style: v.detailColorLabelStyle }, v.detail.colorName)
          ),
          el('div', { style: v.detailDescStyle }, v.detail.desc),
          el('div', { style: v.saveCtaStyle, onClick: v.detail.onSave }, v.detail.saveCtaLabel),
          el('div', { style: v.similarTitleStyle }, 'More like this'),
          el('div', { style: v.masonryStyle }, v.similarView.map(it => this.cardNode(v, it, {})))
        )
      ));
    }

    // SAVE SHEET
    if (v.hasSaveSheet) {
      appKids.push(el('div', { style: v.sheetBackdropStyle, onClick: v.onCloseSave }));
      appKids.push(el('div', { style: v.sheetStyle },
        el('div', { style: v.sheetHandleStyle }),
        el('div', { style: v.sheetTitleStyle }, 'Save to board'),
        el('div', { className: 'sc-scroll', style: v.sheetListStyle },
          v.saveBoards.map(b => el('div', { style: v.sheetRowStyle, onClick: b.onToggle },
            el('div', { style: b.coverStyle }),
            el('div', { style: v.sheetRowTextStyle },
              el('div', { style: v.sheetRowNameStyle }, b.name),
              el('div', { style: v.sheetRowCountStyle }, b.countLabel)
            ),
            el('div', { style: b.checkStyle }, b.checkGlyph)
          )).concat([
            el('div', { style: v.newBoardRowStyle, onClick: v.onNewBoard },
              el('div', { style: v.newBoardIconStyle }, '＋'),
              el('div', { style: v.newBoardTextStyle }, 'Create new board')
            )
          ])
        )
      ));
    }

    // TOAST
    if (v.hasToast) appKids.push(el('div', { style: v.toastStyle }, v.toast));

    const app = el('div', { style: v.appStyle }, appKids);
    return IOSDevice(v.frameProps, app);
  }
}
